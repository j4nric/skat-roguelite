# Runs on the vServer in $DEPLOY_PATH (default /opt/skat). The GitHub Actions
# deploy job syncs ./site, this file and the Caddyfile there and runs
# `docker compose up -d`.
#
# Ports 80/443 on the server belong to the Caddy of the household app
# (repo j4nric/haushalt-app, infra/production). That Caddy terminates HTTPS
# for stammtisch-62-83-23-90.sslip.io and forwards to this container through
# the shared network `stammtisch-proxy` under the alias `stammtisch-web`.
# This container publishes no ports. See ADR 0008.

name: stammtisch

services:
  web:
    image: caddy:2.8-alpine
    restart: unless-stopped
    volumes:
      - ./site:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      proxy:
        aliases: [stammtisch-web]

networks:
  proxy:
    name: stammtisch-proxy
    external: true
