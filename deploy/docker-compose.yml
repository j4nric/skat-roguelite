# Runs on the vServer in $DEPLOY_PATH (default /opt/skat). The GitHub Actions
# deploy job syncs ./site, ./server (the account server binary), this file
# and the Caddyfile there and runs `docker compose up -d`.
#
# Ports 80/443 on the server belong to the Caddy of the household app
# (repo j4nric/haushalt-app, infra/production). That Caddy terminates HTTPS
# for our domains (deploy/site.caddy, which up.sh hands it, ADR 0024) and
# forwards everything to the `web` container through the shared network
# `edge` (and, until it has moved over, `stammtisch-proxy`) under the alias
# `stammtisch-web`. Neither container publishes ports. See ADR 0008.
#
# `web` serves the static site and proxies /api/* to `api` (ADR 0021) over
# the internal network `backend`, which nothing else can reach. `web` does
# not depend on `api`: if the account server is down, the game is still
# served and only /api answers 502.
#
# `up.sh` pulls the images on every deploy, so the pinned minor versions
# below get their patch releases (Caddy, Alpine security fixes).

name: stammtisch

# Logs rotate on the server: at most 3 files of 10 MB per container.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  web:
    image: caddy:2.11-alpine
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./site:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      proxy:
        aliases: [stammtisch-web]
      # Shared network of the front Caddy (ADR 0024); `proxy` stays until the
      # front Caddy has moved over.
      edge:
        aliases: [stammtisch-web]
      backend:

  # Account server (server/ in the repo): a static musl binary built in
  # GitHub Actions, run in a plain Alpine image. SQLite lives in ./data.
  # Runs as the deploy user (uid/gid written to .env by the deploy job), so
  # the database file belongs to that user and can be copied for backups.
  # Locked down: read-only root file system (only ./data and a /tmp in
  # memory are writable), no capabilities, no privilege gain.
  api:
    image: alpine:3.24
    restart: unless-stopped
    logging: *logging
    command: ["/app/stammtisch-server"]
    user: "${STAMMTISCH_UID:-1000}:${STAMMTISCH_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Busybox wget is part of the Alpine image.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      # The new address first (ADR 0025); the old one stays, so its
      # passkeys keep working there until the players have moved. Each host
      # is its own WebAuthn relying party.
      STAMMTISCH_ORIGIN: https://one-more-skat.de,https://stammtisch-62-83-23-90.sslip.io
      # The iOS app (ADR 0026): its web view's origin. CORS for it, and a
      # bearer token instead of the cookie; its passkeys are those of
      # one-more-skat.de (Associated Domains).
      STAMMTISCH_APP_ORIGIN: capacitor://localhost
      STAMMTISCH_DB: /data/stammtisch.db
      STAMMTISCH_LISTEN: 0.0.0.0:8080
      RUST_LOG: info
    volumes:
      - ./server:/app:ro
      - ./data:/data
    networks:
      backend:
        aliases: [stammtisch-api]

networks:
  proxy:
    name: stammtisch-proxy
    external: true
  edge:
    name: edge
    external: true
  backend:
    internal: true
