[workspace]
resolver = "2"
members = ["core", "sim", "wasm", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# Size-optimized build of the WebAssembly core for the browser
# (web/scripts/build-wasm.sh). The simulator keeps the fast release profile.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Deploy build of the account server (CI, static musl binary): release
# without symbols, so no separate `strip` step. Its own profile, so the
# simulator and the WebAssembly profile keep theirs.
[profile.server-release]
inherits = "release"
strip = true

# The PIMC search (core/src/ai/) is far too slow unoptimized; tests that
# play whole runs reach the PIMC sections. Optimize the core in dev and
# test builds too (debug assertions and overflow checks stay on).
[profile.dev.package.skat_core]
opt-level = 2

# The recovery code is hashed with argon2id; unoptimized it takes seconds
# per hash and slows the server tests down.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
