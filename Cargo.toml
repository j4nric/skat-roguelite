[workspace]
resolver = "2"
members = ["core", "sim", "wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# Size-optimized build of the WebAssembly core for the browser
# (web/scripts/build-wasm.sh). The simulator keeps the fast release profile.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
