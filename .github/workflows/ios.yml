name: iOS

# The iOS app (ADR 0026, docs/ios.md): a Capacitor shell around the web
# build in ios/.
#
# - Pull requests and pushes to main that touch the app or the web build:
#   build it for an iPhone without signing, as a check (Swift, project,
#   packages, bundled web files).
# - By hand (Actions -> iOS -> Run workflow) or a tag `ios-v<version>`:
#   archive with automatic signing through the App Store Connect API key,
#   export an App Store IPA and upload it to TestFlight. The build number
#   is the run number of this workflow; the version comes from the tag
#   (`ios-v1.0.1` -> 1.0.1) or the input, else the project's.
#
# The web build runs on Ubuntu like in ci.yml (Rust, wasm-bindgen, Vite);
# the Mac only syncs and builds the Xcode project. No apt anywhere (on
# 11.11.2026 the Ubuntu runners could not resolve *.ubuntu.com for hours),
# and nothing on macOS needs Homebrew.

on:
  pull_request:
    paths:
      - ios/**
      - web/**
      - core/**
      - wasm/**
      - Cargo.lock
      - .github/workflows/ios.yml
  push:
    branches: [main]
    tags: ['ios-v*']
    paths:
      - ios/**
      - web/**
      - core/**
      - wasm/**
      - Cargo.lock
      - .github/workflows/ios.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (CFBundleShortVersionString), empty: the project''s'
        required: false
        default: ''
      upload:
        description: 'Upload to TestFlight'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: web build for the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install 2>/dev/null || rustup show
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build wasm and web app
        working-directory: web
        run: |
          export BUILD_INFO="iOS · ${GITHUB_SHA::7} · $(date -u +%Y-%m-%dT%H:%MZ)"
          npm run build
          # The landing page's film and pictures and the press kit's
          # downloads are for the website only (web/site/presskit.ts); the
          # app opens index.html and never shows those pages.
          rm -rf dist/landing dist/presse
      - uses: actions/upload-artifact@v4
        with:
          name: ios-web-dist
          path: web/dist
          retention-days: 3

  app:
    name: Xcode build${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ios-v')) && ', TestFlight' || ' (unsigned)' }}
    runs-on: macos-latest
    needs: web
    timeout-minutes: 45
    env:
      RELEASE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ios-v') }}
    steps:
      - uses: actions/checkout@v4
      # The newest stable Xcode on the runner (the App Store wants a current SDK).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The Capacitor CLI and the plugins' Swift packages (Package.swift
      # points into web/node_modules).
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ios-web-dist
          path: web/dist
      - name: Sync the web build into the app
        working-directory: web
        run: |
          npx cap sync ios
          test -f ../ios/App/App/public/index.html
          git -C .. status --short ios
          git -C .. diff --exit-code -- ios/App/CapApp-SPM/Package.swift || {
            echo "::error::ios/App/CapApp-SPM/Package.swift is out of date: run 'npx cap sync ios' in web/ and commit it."
            exit 1
          }
      - name: Versions
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          xcodebuild -version
          version="$INPUT_VERSION"
          case "$GITHUB_REF" in refs/tags/ios-v*) version="${GITHUB_REF#refs/tags/ios-v}" ;; esac
          if [ -n "$version" ] && ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::version '$version' is not like 1.2.3"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "version '${version:-from project}', build ${{ github.run_number }}"
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Build without signing
        if: env.RELEASE != 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
            | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E '^(\*\*|error:|warning: .*NativeAccount|.*: error:)' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$RUNNER_TEMP/xcodebuild.log"
          app="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :ITSAppUsesNonExemptEncryption' -c 'Print :CFBundleVersion' "$app/Info.plist"
          test -f "$app/public/index.html"

      # --- Release: archive, sign, export, upload -------------------------

      - name: API key
        if: env.RELEASE == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_P8" ] || [ -z "$TEAM_ID" ]; then
            echo "::error::Secrets missing: APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_KEY_P8, APPLE_TEAM_ID (docs/ios.md)."
            exit 1
          fi
          # Only in the runner's temp folder, removed at the end (also on failure).
          # altool looks for ./private_keys/AuthKey_<id>.p8 in its working folder.
          umask 077
          mkdir -p "$RUNNER_TEMP/asc/private_keys"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/asc/private_keys/AuthKey_$KEY_ID.p8"
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/asc/private_keys/AuthKey_$KEY_ID.p8" || {
            echo "::error::APPSTORE_API_KEY_P8 does not look like a .p8 file (BEGIN PRIVATE KEY … END PRIVATE KEY)."
            exit 1
          }

      # The archive is unsigned: automatic signing at archive time wants a
      # development profile, which needs a registered device (and iOS 26 allows
      # no ad-hoc signing). The App Store signature comes with the export below
      # (cloud-managed distribution certificate via the API key); the export
      # step checks that the associated domain made it into the signed app.
      - name: Archive (unsigned)
        if: env.RELEASE == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -o pipefail
          extra=""
          [ -n "$VERSION" ] && extra="MARKETING_VERSION=$VERSION"
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} $extra \
            | tee "$RUNNER_TEMP/archive.log" | grep -E '^(\*\*|error:|.*: error:)' || true
          grep -q '\*\* ARCHIVE SUCCEEDED \*\*' "$RUNNER_TEMP/archive.log"
          # Unsigned binaries carry no entitlements, and the export takes them
          # from the archived signature: sign the archived app ad hoc with its
          # entitlements (codesign allows that; only Xcode's build refuses), so
          # the App Store signature of the export keeps the associated domain.
          app=$(ls -d "$RUNNER_TEMP"/App.xcarchive/Products/Applications/*.app)
          if [ -d "$app/Frameworks" ]; then
            find "$app/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \;
          fi
          codesign --force --sign - --entitlements ios/App/App/App.entitlements --generate-entitlement-der "$app"
          codesign -d --entitlements - --xml "$app" 2>/dev/null | grep -q 'webcredentials:one-more-skat.de'

      - name: Export App Store IPA
        if: env.RELEASE == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/private_keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | tee "$RUNNER_TEMP/export.log" | grep -E '^(\*\*|error:|.*: error:)' || true
          grep -q '\*\* EXPORT SUCCEEDED \*\*' "$RUNNER_TEMP/export.log"
          ls -la "$RUNNER_TEMP/export"
          # The passkeys need the associated domain in the signed app.
          rm -rf "$RUNNER_TEMP/ipa" && mkdir "$RUNNER_TEMP/ipa"
          unzip -q "$RUNNER_TEMP"/export/*.ipa -d "$RUNNER_TEMP/ipa"
          codesign -d --entitlements - --xml "$RUNNER_TEMP"/ipa/Payload/*.app > "$RUNNER_TEMP/ent.xml" 2>/dev/null
          grep -q 'webcredentials:one-more-skat.de' "$RUNNER_TEMP/ent.xml" || { echo "::error::The signed app lacks webcredentials:one-more-skat.de"; cat "$RUNNER_TEMP/ent.xml"; exit 1; }
          grep -q '<string>production</string>\|beta-reports-active' "$RUNNER_TEMP/ent.xml" && echo "distribution entitlements present"

      - name: Upload to TestFlight
        if: env.RELEASE == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.upload == 'true')
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          cd "$RUNNER_TEMP/asc"
          xcrun altool --validate-app -f "$ipa" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          xcrun altool --upload-app -f "$ipa" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "### TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "Build ${{ steps.version.outputs.build }} uploaded; App Store Connect processes it for a few minutes before it shows up in TestFlight." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ${{ runner.temp }}/*.log
          retention-days: 7
          if-no-files-found: ignore
