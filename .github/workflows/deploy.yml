name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen CLI (same version as the crate)
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -qx "wasm-bindgen 0.2.130"; then
            cargo install wasm-bindgen-cli --version 0.2.130 --locked --force
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Simulator baseline
        run: cargo run --release -p skat_sim -- --seed 42 --games 10000 | tee sim-baseline.txt
      - name: Build web app
        working-directory: web
        run: |
          npm ci
          export BUILD_INFO="${GITHUB_SHA::7} · $(date -u +%Y-%m-%dT%H:%MZ)"
          npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r web/dist/. site/
          cp sim-baseline.txt site/
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  deploy:
    name: deploy to vServer
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: Check secrets
        id: secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ] || [ -z "$DEST" ]; then
            echo "::warning::Deploy secrets missing (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH). Skipping server step. See deploy/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Sync files
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "mkdir -p '$DEST/site'"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" site/ "$USER@$HOST:$DEST/site/"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" deploy/docker-compose.yml deploy/Caddyfile "$USER@$HOST:$DEST/"
      - name: Start or update containers
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "
            docker network inspect stammtisch-proxy >/dev/null 2>&1 || docker network create stammtisch-proxy
            cd '$DEST' && docker compose up -d --remove-orphans && docker compose ps
          "
