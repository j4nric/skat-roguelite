name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen CLI (same version as the crate)
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -qx "wasm-bindgen 0.2.130"; then
            cargo install wasm-bindgen-cli --version 0.2.130 --locked --force
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Simulator baseline
        run: cargo run --release -p skat_sim -- --seed 42 --games 10000 | tee sim-baseline.txt
      - name: Build web app
        working-directory: web
        run: |
          npm ci
          export BUILD_INFO="${GITHUB_SHA::7} · $(date -u +%Y-%m-%dT%H:%MZ)"
          npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r web/dist/. site/
          cp sim-baseline.txt site/
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

  server:
    name: build account server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      # A static musl binary (ADR 0021): no runtime on the server beyond a
      # plain Alpine image, nothing built there. musl-gcc compiles the
      # bundled SQLite.
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static binary
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p stammtisch_server --target x86_64-unknown-linux-musl
          mkdir -p server-bin
          cp target/x86_64-unknown-linux-musl/release/stammtisch-server server-bin/
          strip server-bin/stammtisch-server || true
          file server-bin/stammtisch-server
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: server-bin

  deploy:
    name: deploy to vServer
    runs-on: ubuntu-latest
    needs: [build, server]
    # A broken account server build must not hold back the game itself.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: server
          path: server-bin
      - name: Check secrets
        id: secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ] || [ -z "$DEST" ]; then
            echo "::warning::Deploy secrets missing (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH). Skipping server step. See deploy/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Sync files
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          # data/ holds the SQLite file of the account server; never synced, never deleted.
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "mkdir -p '$DEST/site' '$DEST/server' '$DEST/data'"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" site/ "$USER@$HOST:$DEST/site/"
          if [ -f server-bin/stammtisch-server ]; then
            # Artifacts lose the executable bit.
            chmod 755 server-bin/stammtisch-server
            rsync -az -e "ssh -i ~/.ssh/deploy_key" server-bin/stammtisch-server "$USER@$HOST:$DEST/server/"
          else
            echo "::warning::No account server binary built; the one on the server (if any) stays."
          fi
          rsync -az -e "ssh -i ~/.ssh/deploy_key" deploy/docker-compose.yml deploy/Caddyfile deploy/up.sh "$USER@$HOST:$DEST/"
      - name: Start or update containers
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "sh '$DEST/up.sh'"
