name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Everything is built and tested once, by the CI workflow (ci.yml); its
  # artifacts are what goes to the server.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy to vServer
    runs-on: ubuntu-latest
    needs: ci
    # A broken account server build must not hold back the game itself, so
    # this runs even when CI failed. What gates it are the artifacts:
    # web-dist (the web job) and sim-baseline (only after fmt, clippy and
    # the tests passed) must exist, the server binary may be missing.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: sim-baseline
          path: sim-out
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: server
          path: server-bin
      - name: Assemble site
        run: |
          cp sim-out/baseline.txt site/sim-baseline.txt
          ls -la site
      - name: Check secrets
        id: secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ] || [ -z "$DEST" ]; then
            echo "::warning::Deploy secrets missing (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH). Skipping server step. See deploy/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # With the optional secret DEPLOY_KNOWN_HOSTS (the server's host key
      # line, deploy/README.md) the key is checked strictly; without it the
      # key is taken from ssh-keyscan on first sight, as before.
      - name: Set up SSH
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set; trusting the host key from ssh-keyscan. See deploy/README.md."
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          {
            echo "Host $HOST"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Sync files
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          # data/ holds the SQLite file of the account server (and its daily
          # backups); never synced, never deleted.
          ssh "$USER@$HOST" "mkdir -p '$DEST/site' '$DEST/server' '$DEST/data'"
          # New files land under temporary names and are renamed together at
          # the end; old ones go only after that. A page loaded meanwhile
          # never sees half a build.
          rsync -az --delete-after --delay-updates site/ "$USER@$HOST:$DEST/site/"
          if [ -f server-bin/stammtisch-server ]; then
            # Artifacts lose the executable bit.
            chmod 755 server-bin/stammtisch-server
            rsync -az server-bin/stammtisch-server "$USER@$HOST:$DEST/server/"
          else
            echo "::warning::No account server binary built; the one on the server (if any) stays."
          fi
          rsync -az deploy/docker-compose.yml deploy/Caddyfile deploy/site.caddy deploy/up.sh deploy/aasa.sh "$USER@$HOST:$DEST/"
      - name: Start or update containers
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
          # Apple team id for the iOS app's passkeys (ADR 0025): a repository
          # variable, not a secret (it is public in the file it goes into).
          # Only ten letters or digits pass; anything else is sent as empty.
          TEAM: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: |
          printf '%s' "$TEAM" | grep -Eq '^[A-Z0-9]{10}$' || TEAM=
          ssh "$USER@$HOST" "APPLE_TEAM_ID='$TEAM' sh '$DEST/up.sh'"
