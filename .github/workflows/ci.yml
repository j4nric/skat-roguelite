name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  server:
    name: account server (static musl build, Caddyfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The server's tests run in `check` with the whole workspace; this
      # builds the binary exactly as the deploy does.
      - name: Build static binary
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked -p stammtisch_server --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/stammtisch-server
      - name: Validate Caddyfile
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.8-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config --quiet

  sim-baseline:
    name: simulator baseline
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run simulator with fixed seed
        run: |
          mkdir -p sim-out
          cargo run --release -p skat_sim -- --seed 42 --games 10000 | tee sim-out/baseline.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sim-baseline
          path: sim-out/baseline.txt

  web:
    name: wasm and web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Install wasm-bindgen CLI (same version as the crate)
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -qx "wasm-bindgen 0.2.130"; then
            cargo install wasm-bindgen-cli --version 0.2.130 --locked --force
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build wasm and web app
        working-directory: web
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
