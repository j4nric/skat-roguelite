[package]
name = "stammtisch_server"
description = "Account and save server for the Skat roguelike: passkeys, recovery code, save blob, daily leaderboard (ADR 0021)."
version.workspace = true
edition.workspace = true
rust-version = "1.89"
publish.workspace = true

[[bin]]
name = "stammtisch-server"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["json", "query", "tokio", "http1"], default-features = false }
base64 = "0.22"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = { version = "0.6.2", features = ["conditional-ui"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
